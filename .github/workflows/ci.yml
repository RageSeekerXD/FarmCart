name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Continuous integration (ci.ps1)
        shell: pwsh
        run: ./ci.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports
          path: artifacts/
